<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="960" height="600" fill="#0B1521"/>
  <text x="48" y="52" fill="#FFFFFF" font-size="27" font-weight="700">硬件架构 / Hardware Architecture</text>
  <text x="48" y="80" fill="#8FBCE4" font-size="14">征辰 1.54TFT Wi-Fi · ESP32-S3-N16R8</text>
  <line x1="48" y1="96" x2="912" y2="96" stroke="#2E4A70" stroke-width="1"/>

  <!-- center chip -->
  <rect x="376" y="248" width="208" height="128" rx="8" fill="#13263B" stroke="#63A7D4" stroke-width="2"/>
  <text x="480" y="288" fill="#63A7D4" font-size="22" font-weight="700" text-anchor="middle">ESP32-S3</text>
  <text x="480" y="314" fill="#E3F1F8" font-size="14" text-anchor="middle">双核 Xtensa · 240MHz</text>
  <text x="480" y="338" fill="#A9CFE7" font-size="13" text-anchor="middle">16MB Flash + 8MB PSRAM</text>
  <text x="480" y="360" fill="#A9CFE7" font-size="13" text-anchor="middle">Wi-Fi / BLE5</text>

  <!-- left column: input -->
  <rect x="48" y="150" width="216" height="86" rx="8" fill="#232C37" stroke="#4DA3FF" stroke-width="1"/>
  <text x="64" y="178" fill="#4DA3FF" font-size="15" font-weight="700">🎤 数字麦克风</text>
  <text x="64" y="202" fill="#E7E8E9" font-size="13">I2S 输入 · GPIO 6/7/15</text>
  <text x="64" y="222" fill="#A9CFE7" font-size="12">唤醒词 → ASR → 指令</text>

  <rect x="48" y="256" width="216" height="86" rx="8" fill="#232C37" stroke="#4DA3FF" stroke-width="1"/>
  <text x="64" y="284" fill="#4DA3FF" font-size="15" font-weight="700">🔘 三枚实体按键</text>
  <text x="64" y="308" fill="#E7E8E9" font-size="13">BOOT(0) / VOL+(10) / VOL-(39)</text>
  <text x="64" y="328" fill="#A9CFE7" font-size="12">唤醒 · 音量 · 进下载模式</text>

  <rect x="48" y="362" width="216" height="86" rx="8" fill="#232C37" stroke="#4DA3FF" stroke-width="1"/>
  <text x="64" y="390" fill="#4DA3FF" font-size="15" font-weight="700">🔋 电源管理</text>
  <text x="64" y="414" fill="#E7E8E9" font-size="13">GPIO2 电平锁存供电</text>
  <text x="64" y="434" fill="#A9CFE7" font-size="12">ON/OFF 切换 · 低功耗定时</text>

  <!-- right column: output -->
  <rect x="696" y="150" width="216" height="110" rx="8" fill="#232C37" stroke="#63A7D4" stroke-width="1"/>
  <text x="712" y="178" fill="#63A7D4" font-size="15" font-weight="700">🖥️ ST7789 彩屏</text>
  <text x="712" y="202" fill="#E7E8E9" font-size="13">240×240 · SPI3 · 80MHz</text>
  <text x="712" y="222" fill="#A9CFE7" font-size="12">MOSI41 SCK42 CS21</text>
  <text x="712" y="242" fill="#A9CFE7" font-size="12">DC40 RST45 BL20</text>
  <text x="712" y="258" fill="#4DA3FF" font-size="12">LVGL 9 · 今日一词摆件</text>

  <rect x="696" y="280" width="216" height="86" rx="8" fill="#232C37" stroke="#63A7D4" stroke-width="1"/>
  <text x="712" y="308" fill="#63A7D4" font-size="15" font-weight="700">🔊 喇叭 / 功放</text>
  <text x="712" y="332" fill="#E7E8E9" font-size="13">I2S 直推 · BCLK15/LRCK16</text>
  <text x="712" y="352" fill="#A9CFE7" font-size="12">TTS 念词 · 教学反馈</text>

  <rect x="696" y="386" width="216" height="86" rx="8" fill="#232C37" stroke="#63A7D4" stroke-width="1"/>
  <text x="712" y="414" fill="#63A7D4" font-size="15" font-weight="700">💡 背光 / LED</text>
  <text x="712" y="438" fill="#E7E8E9" font-size="13">GPIO20 高电平点亮</text>
  <text x="712" y="458" fill="#A9CFE7" font-size="12">亮度可调 · 状态指示</text>

  <!-- bottom: cloud -->
  <rect x="300" y="474" width="360" height="82" rx="8" fill="#24428F" stroke="#8FBCE4" stroke-width="1"/>
  <text x="480" y="504" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">☁️ 云端 AI · xiaozhi.me</text>
  <text x="480" y="528" fill="#E3F1F8" font-size="13" text-anchor="middle">唤醒词检测 · 流式 ASR · LLM 教学主持 · TTS 合成</text>
  <text x="480" y="546" fill="#A9CFE7" font-size="12" text-anchor="middle">MCP 工具：get_today / next / mark_passed</text>

  <!-- connectors -->
  <path d="M264 193 H340 Q360 193 360 213 V280 H376" fill="none" stroke="#4DA3FF" stroke-width="1.6"/>
  <path d="M264 299 H376" fill="none" stroke="#4DA3FF" stroke-width="1.6"/>
  <path d="M264 405 H340 Q360 405 360 385 V344 H376" fill="none" stroke="#4DA3FF" stroke-width="1.6"/>
  <path d="M584 300 H640 Q660 300 660 280 V205 H696" fill="none" stroke="#63A7D4" stroke-width="1.6"/>
  <path d="M584 317 H696 V323" fill="none" stroke="#63A7D4" stroke-width="1.6"/>
  <path d="M584 340 H640 Q660 340 660 366 V423 H696" fill="none" stroke="#63A7D4" stroke-width="1.6"/>
  <path d="M480 376 V474" fill="none" stroke="#E3F1F8" stroke-width="1.8" stroke-dasharray="6 4"/>

  <text x="480" y="586" fill="#8FBCE4" font-size="12" text-anchor="middle">SPI 屏幕 · I2S 音频 · GPIO 电源锁存 · Wi-Fi 云端 AI —— 全部板载，零飞线</text>
</svg>
